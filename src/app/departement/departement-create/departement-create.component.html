<div class="container">
    <h2>Créer un département</h2>
  
    <form [formGroup]="departementForm" (ngSubmit)="onSubmit()">
      <label for="name">Nom du département :</label>
      <input id="name" formControlName="name" type="text" required />
      <div *ngIf="departementForm.controls['name'].invalid && departementForm.controls['name'].touched">
        
      </div>
  
      <label for="description">Description :</label>
      <textarea id="description" formControlName="description" required></textarea>
      <div *ngIf="departementForm.controls['description'].invalid && departementForm.controls['description'].touched">
        La description est obligatoire.
      </div>
  
      <button (click)="createDepartment() "  [disabled]="departementForm.invalid || loading()">
        {{ loading() ? 'Création...' : 'Créer' }}
      </button>
    </form>
  </div>
